name: Build IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen kur
        run: brew install xcodegen
      - name: Projeyi olustur
        run: xcodegen generate
      - name: Derle
        run: |
          xcodebuild -project PetIsland.xcodeproj -target PetIsland \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PetIsland.app Payload/
          zip -qr AdaHayvanlari.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AdaHayvanlari-ipa
          path: AdaHayvanlari.ipa
